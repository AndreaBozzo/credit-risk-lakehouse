[project]
name = "credit-risk-lakehouse"
version = "0.1.0"
description = "Credit risk analysis using SEC EDGAR XBRL filings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Andrea Bozzo", email = "andreabozzo92@gmail.com"}
]
keywords = ["credit-risk", "xbrl", "sec", "financial-analysis", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "duckdb>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
cr-download = "scripts.download:main"
cr-parse = "scripts.parse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]